name: Documentation Deployment
# The documentation has moved to https://champagnn.github.io/arcann_training/.
# This workflow replaces the old site on gh-pages with a single "we've moved"
# page (redirect_site/index.html). Every old URL, through 404.html, redirects to
# the new home page. It only deploys from main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redirect site
        run: |
          mkdir _site
          cp redirect_site/index.html _site/index.html
          cp redirect_site/index.html _site/404.html
          touch _site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Replace documentation with a we've moved page"
